name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gymcord-fantasy-web-app

      # frontend/package.json depends on gymcord-design-system via a
      # file:../../gymcord-design-system path (local dev uses a sibling
      # checkout) — check that repo out at the same relative path here so
      # npm ci can resolve it, and build its dist/ since that's gitignored.
      - name: Checkout design system
        uses: actions/checkout@v4
        with:
          repository: gymcorddiscord/gymcord-design-system
          path: gymcord-design-system

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            gymcord-fantasy-web-app/frontend/package-lock.json
            gymcord-design-system/package-lock.json

      - name: Build design system
        run: npm ci && npm run build
        working-directory: gymcord-design-system

      - name: Install dependencies
        run: npm ci --prefix gymcord-fantasy-web-app/frontend

      - name: Build
        run: npm run build --prefix gymcord-fantasy-web-app/frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: gymcord-fantasy-web-app/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
